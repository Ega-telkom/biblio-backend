services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /var/www
    env_file:
      - .env.production
    ports:
      - "127.0.0.1:9000:9000" # Hanya terbuka untuk localhost agar aman dari luar
    volumes:
      # Volume untuk membagikan asset Laravel ke Nginx Host
      - /var/www/biblio-backend/public:/var/www/public
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: biblio_db
    restart: unless-stopped
    # Bagus jika tidak mengekspos port DB ke publik jika tidak diperlukan,
    # port di bawah di-bind ke 127.0.0.1 agar hanya bisa diakses dari host/local VPS saja.
    ports:
      - "127.0.0.1:5432:5432" 
    environment:
      POSTGRES_DB: biblio
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d biblio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: biblio_redis
    restart: unless-stopped
    command: redis-server --requirepass SOMEPASSWORD
    volumes:
      - redis_data:/data
    networks:
      - app-network

  minio:
    image: minio/minio:latest # Pastikan pakai tag versi atau latest daripada kosongan
    container_name: biblio_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "127.0.0.1:9001:9001" # Bind ke 127.0.0.1 agar konsol MinIO aman di balik proxy host nanti
    environment:
      MINIO_ROOT_USER: SOMEPASSWORD
      MINIO_ROOT_PASSWORD: SOMEPASSWORD
    volumes:
      - minio_data:/data
    networks:
      - app-network

volumes:
  pgdata:
  redis_data:
  minio_data:
  # Volume baru untuk sinkronisasi file public Laravel ke mesin host
  biblio_public_assets: 

networks:
  app-network:
    driver: bridge