services:
  app:
    env_file:
        - .env.production
    build:
      context: .
      dockerfile: Dockerfile
    container_name: biblio_app
    restart: unless-stopped
    working_dir: /var/www
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: biblio_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  db:
    image: postgres:16-alpine
    container_name: biblio_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: biblio
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d biblio"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: biblio_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app-network

  minio:
    image: minio/minio
    container_name: biblio_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    ports:
      - "9001:9001"   # console — hapus di prod kalau tidak perlu
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    networks:
      - app-network

volumes:
  pgdata:
  redis_data:
  minio_data:

networks:
  app-network:
    driver: bridge